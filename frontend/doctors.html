<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctors - MediCloud</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app"><aside class="sidebar"><div class="brand">🏥 <span>MediCloud</span></div>
<nav><a href="index.html">📊 Dashboard</a><a href="patients.html">🧑‍🤝‍🧑 Patients</a><a class="active" href="doctors.html">👨‍⚕️ Doctors</a><a href="appointments.html">📅 Appointments</a><a href="medical-records.html">📋 Medical Records</a><a href="billing.html">💳 Billing</a></nav><button class="logout" onclick="logout()">↪ Logout</button></aside>
<main class="main"><header class="topbar"><div><h1>Doctors</h1><p>Manage hospital doctors</p></div></header>
<section class="panel"><div class="panel-head"><h2>Add Doctor</h2></div>
<form id="doctorForm" class="form-grid"><input id="name" placeholder="Doctor Name" required><input id="specialization" placeholder="Specialization" required>
<input id="phone" placeholder="Phone" required><input id="experience" type="number" placeholder="Experience (years)">

<section class="panel"><div class="panel-head"><h2>Doctor List</h2></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Specialization</th><th>Phone</th><th>Experience</th><th>Fee</th><th>Action</th></tr></thead><tbody id="doctorTable"></tbody></table></div></section>
</main></div><script src="js/script.js"></script><script src="js/doctors.js"></script></body></html>
