<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediCloud - Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
<div class="login-card">
  <div class="login-logo">🏥</div>
  <h1>MediCloud Hospital</h1>
  <p>Hospital Management System</p>
  <form id="loginForm">
    <label>Email</label><input type="email" id="email" value="admin@medicloud.com" required>
    <label>Password</label><input type="password" id="password" value="admin123" required>
    <button class="btn full" type="submit">Login</button>
  </form>
  <small>Demo login: admin@medicloud.com / admin123</small>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit", async e=>{
 e.preventDefault();
 const res=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
 body:JSON.stringify({email:email.value,password:password.value})});
 const data=await res.json();
 if(data.success){localStorage.setItem("loggedIn","true");location.href="index.html";}
 else alert(data.message);
});
</script>
</body>
</html>
