<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Records - MediCloud</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app"><aside class="sidebar"><div class="brand">🏥 <span>MediCloud</span></div>
<nav><a href="index.html">📊 Dashboard</a><a href="patients.html">🧑‍🤝‍🧑 Patients</a><a href="doctors.html">👨‍⚕️ Doctors</a><a href="appointments.html">📅 Appointments</a><a class="active" href="medical-records.html">📋 Medical Records</a><a href="billing.html">💳 Billing</a></nav><button class="logout" onclick="logout()">↪ Logout</button></aside>
<main class="main"><header class="topbar"><div><h1>Medical Records</h1><p>Maintain patient diagnosis and treatment records</p></div></header>
<section class="panel"><div class="panel-head"><h2>Add Medical Record</h2></div>
<form id="recordForm" class="form-grid"><select id="patientId" required><option value="">Select Patient</option></select>
<input id="diagnosis" placeholder="Diagnosis" required><input id="medicines" placeholder="Medicines">
<textarea id="notes" placeholder="Doctor notes"></textarea><input id="recordDate" type="date" required><button class="btn" type="submit">Save Record</button></form></section>
<section class="panel"><div class="panel-head"><h2>Medical Records</h2></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Patient</th><th>Diagnosis</th><th>Medicines</th><th>Notes</th><th>Date</th><th>Action</th></tr></thead><tbody id="recordTable"></tbody></table></div></section>
</main></div><script src="js/script.js"></script><script src="js/records.js"></script></body></html>
